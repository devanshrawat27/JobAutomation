services:
  db:
    image: postgres:18-alpine
    container_name: jobautomation-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobautomation
      POSTGRES_PASSWORD: jobautomation_dev
      POSTGRES_DB: jobautomation
    ports:
      - "5433:5432"
    volumes:
      - jobautomation-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobautomation -d jobautomation"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  jobautomation-db:
